name: Apply Explorer Patch

on:
  pull_request:
    paths:
      - ".github/patches/explorer-upgrade.*.b64"
      - ".github/workflows/apply-explorer-patch.yml"

permissions:
  contents: write

jobs:
  apply-explorer-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/explorer-foundation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/patches/explorer-upgrade.*.b64 | tr -d '\n' | base64 -d > /tmp/explorer-upgrade.patch
          echo "e29d17511ae1c2fb3ca5c673e4095bcfa2012395bbab475864ffc08d73238110  /tmp/explorer-upgrade.patch" | sha256sum -c -
          git apply --check /tmp/explorer-upgrade.patch

      - name: Apply patch
        run: git apply /tmp/explorer-upgrade.patch

      - name: Apply Clippy corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/explorer.rs")
          text = path.read_text()
          text = text.replace(
              "sync::mpsc::{self, Receiver, Sender, TryRecvError}",
              "sync::mpsc::{self, Receiver, Sender}",
              1,
          )
          old_try_recv = (
              "    fn try_recv(&self) -> Option<ExplorerEvent> {\n"
              "        match self.events.try_recv() {\n"
              "            Ok(event) => Some(event),\n"
              "            Err(TryRecvError::Empty | TryRecvError::Disconnected) => None,\n"
              "        }\n"
              "    }"
          )
          new_try_recv = (
              "    fn try_recv(&self) -> Option<ExplorerEvent> {\n"
              "        self.events.try_recv().ok()\n"
              "    }"
          )
          if old_try_recv not in text:
              raise SystemExit("expected try_recv implementation not found")
          text = text.replace(old_try_recv, new_try_recv, 1)

          old_error = (
              "    Err(io::Error::new(\n"
              "        io::ErrorKind::Other,\n"
              "        if message.is_empty() {\n"
              "            \"git status failed without an error message\".to_string()\n"
              "        } else {\n"
              "            message\n"
              "        },\n"
              "    ))"
          )
          new_error = (
              "    Err(io::Error::other(if message.is_empty() {\n"
              "        \"git status failed without an error message\".to_string()\n"
              "    } else {\n"
              "        message\n"
              "    }))"
          )
          if old_error not in text:
              raise SystemExit("expected io::Error::new block not found")
          path.write_text(text.replace(old_error, new_error, 1))
          PY

      - name: Verify synchronous tree Git refresh was removed
        shell: bash
        run: |
          if grep -R "refresh_git_status" -n src; then
            echo "Synchronous project-tree Git refresh remains in source."
            exit 1
          fi

      - name: Format
        run: cargo fmt --all

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/explorer-clippy.log

      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-clippy-diagnostics
          path: /tmp/explorer-clippy.log
          if-no-files-found: warn

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build release
        run: cargo build --locked --release

      - name: Commit validated implementation
        shell: bash
        run: |
          git rm .github/patches/explorer-upgrade.*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/project.rs src/explorer.rs src/app.rs src/app/persistence.rs src/ui.rs docs/ARCHITECTURE.md docs/SMOKE_TEST_0.7.md
          git commit -m "explorer: finish async refresh and polish tree UI"
          git push origin HEAD:agent/explorer-foundation

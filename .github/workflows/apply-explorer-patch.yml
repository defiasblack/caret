name: Apply Explorer Patch

on:
  pull_request:
    paths:
      - ".github/patches/explorer-upgrade.*.b64"
      - ".github/workflows/apply-explorer-patch.yml"

permissions:
  contents: write

jobs:
  apply-explorer-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/explorer-foundation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/patches/explorer-upgrade.*.b64 | tr -d '\n' | base64 -d > /tmp/explorer-upgrade.patch
          echo "e29d17511ae1c2fb3ca5c673e4095bcfa2012395bbab475864ffc08d73238110  /tmp/explorer-upgrade.patch" | sha256sum -c -
          git apply --check /tmp/explorer-upgrade.patch

      - name: Apply patch
        run: git apply /tmp/explorer-upgrade.patch

      - name: Verify synchronous tree Git refresh was removed
        shell: bash
        run: |
          if grep -R "refresh_git_status" -n src; then
            echo "Synchronous project-tree Git refresh remains in source."
            exit 1
          fi

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build release
        run: cargo build --locked --release

      - name: Commit validated implementation
        shell: bash
        run: |
          git rm .github/patches/explorer-upgrade.*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/project.rs src/explorer.rs src/app.rs src/app/persistence.rs src/ui.rs docs/ARCHITECTURE.md docs/SMOKE_TEST_0.7.md
          git commit -m "explorer: finish async refresh and polish tree UI"
          git push origin HEAD:agent/explorer-foundation

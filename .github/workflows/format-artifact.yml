name: Apply Rustfmt

on:
  push:
    branches:
      - agent/explorer-foundation

permissions:
  contents: write

jobs:
  apply-rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/explorer-foundation

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet -- src/explorer.rs src/main.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/explorer.rs src/main.rs
          git commit -m "style: apply rustfmt to explorer foundation"
          git push origin HEAD:agent/explorer-foundation

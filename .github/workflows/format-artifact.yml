name: Format Artifact

on:
  pull_request:
    paths:
      - "src/**/*.rs"
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-sources
          path: |
            src/explorer.rs
            src/main.rs
          if-no-files-found: error

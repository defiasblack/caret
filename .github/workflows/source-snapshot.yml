name: Source Snapshot

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/source-snapshot.yml"
      - ".github/workflows/apply-explorer-upgrade.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: caret-source
          path: |
            README.md
            Cargo.toml
            Cargo.lock
            src
            docs
            tests
            examples
            .github/workflows/ci.yml
            .github/workflows/source-snapshot.yml
            .github/workflows/apply-explorer-upgrade.yml
          if-no-files-found: warn
